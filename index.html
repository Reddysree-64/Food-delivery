
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <h1>🍔 Foodie</h1>
            <p class="subtitle">Delicious food delivered to your door!</p>

            <div class="auth-tabs">
                <button id="loginTab" class="active" onclick="showLogin()">Login</button>
                <button id="signupTab" onclick="showSignup()">Sign Up</button>
            </div>

            <form id="loginForm">
                <h2>Welcome Back!</h2>

                <input type="email" id="loginEmail"
                    placeholder="Email Address" required>

                <input type="password" id="loginPassword"
                    placeholder="Password" required>

                <button type="submit" class="main-btn">Login</button>
                <p id="loginMessage" class="message"></p>
            </form>

            <form id="signupForm" style="display:none;">
                <h2>Create Account</h2>

                <input type="text" id="signupName"
                    placeholder="Full Name" required>

                <input type="email" id="signupEmail"
                    placeholder="Email Address" required>

                <input type="password" id="signupPassword"
                    placeholder="Password" required>

                <textarea id="signupAddress"
                    placeholder="Delivery Address" required></textarea>

                <button type="submit" class="main-btn">Create Account</button>
                <p id="signupMessage" class="message"></p>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
